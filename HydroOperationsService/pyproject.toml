[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-operations-service"
version = "0.1.0"
description = "Local validation of durable Hydro agent workflow boundaries"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.19.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.11,<3",
    "filelock>=3.16,<4",
    "azure-identity>=1.25,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pyright>=1.1.400,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
