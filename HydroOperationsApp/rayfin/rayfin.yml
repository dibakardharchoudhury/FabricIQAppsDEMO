id: hydro-operations
appName: hydro-operations
description: Hydro turbine operations and maintenance on Microsoft Fabric
version: 1.0.0
services:
  db:
    enabled: true
    dialect: mssql
    schema:
      entitiesPath: ./data/schema.ts
  auth:
    enabled: true
    password:
      enabled: false
    fabric:
      enabled: true
    allowedRedirectUris:
      - https://curly-dove-3ef414f49d-swedencentral.webapp.fabricapps.net
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  functions:
    enabled: false
workspace:
  name: ${FABRIC_WORKSPACE_NAME}
