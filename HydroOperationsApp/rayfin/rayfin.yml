id: hydro-operations-ui
appName: hydro-operations-ui
description: Hydro turbine operations and maintenance on Microsoft Fabric
version: 1.0.1
services:
  db:
    enabled: true
    dialect: mssql
    schema:
      entitiesPath: ./data/schema.ts
  auth:
    enabled: true
    password:
      enabled: false
    fabric:
      enabled: true
    allowedRedirectUris:
      - https://valid-iris-08bca88f8e-swedencentral.webapp.fabricapps.net
      - https://rural-haze-8e8396be06-swedencentral.webapp.fabricapps.net
      - https://early-iris-f14ccec1b4-swedencentral.webapp.fabricapps.net
      - https://soft-cape-3e48fdb831-swedencentral.webapp.fabricapps.net
      - https://agile-peak-bb55ff4436-swedencentral.webapp.fabricapps.net
      - https://full-wren-9f95184e46-swedencentral.webapp.fabricapps.net
      - https://pine-bolt-bb8eb5474e-swedencentral.webapp.fabricapps.net
      - https://curly-dove-3ef414f49d-swedencentral.webapp.fabricapps.net
      - https://lucid-bloom-4c2e0a0b0d-swedencentral.webapp.fabricapps.net
      - https://easy-pond-ecd8897c4d-swedencentral.webapp.fabricapps.net
      - https://curly-dove-3ef4114f49d-swedencentral.webapp.fabricapps.net
      - https://wide-weld-988572c16f-swedencentral.webapp.fabricapps.net
      - http://localhost:5173
      - https://merry-birch-f03aa74f0e-swedencentral.webapp.fabricapps.net
      - https://right-forge-2c0b55c94f-swedencentral.webapp.fabricapps.net
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  functions:
    enabled: false
workspace:
  name: ${FABRIC_WORKSPACE_NAME}
