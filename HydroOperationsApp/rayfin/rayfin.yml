id: hydro-operations-ui
appName: hydro-operations-ui
description: Hydro turbine operations and maintenance on Microsoft Fabric
version: 1.0.1
services:
  db:
    enabled: true
    dialect: mssql
    schema:
      entitiesPath: ./data/schema.ts
  auth:
    enabled: true
    password:
      enabled: false
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - https://solar-dew-0ad1824bab-norwayeast.webapp.fabricapps.net
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: protected
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  functions:
    enabled: false
workspace:
  name: ${FABRIC_WORKSPACE_NAME}
connectors:
  - name: hydrooperations
    type: fabric-sqldatabase
    config:
      workspaceId: ${RAYFIN_PUBLIC_WORKSPACE_ID}
      itemId: ${RAYFIN_PUBLIC_OPERATIONAL_SQL_DATABASE_ID}
    auth:
      type: delegated
    operations:
      - name: read
      - name: create
      - name: update
      - name: delete
  - name: hydrolakehouse
    type: fabric-sqlanalytics
    config:
      workspaceId: ${RAYFIN_PUBLIC_WORKSPACE_ID}
      itemId: ${RAYFIN_PUBLIC_LAKEHOUSE_SQL_ENDPOINT_ID}
    auth:
      type: delegated
    operations:
      - name: read
  - name: hydrogeo
    type: fabric-sqlanalytics
    config:
      workspaceId: ${RAYFIN_PUBLIC_WORKSPACE_ID}
      itemId: ${RAYFIN_PUBLIC_GEO_SQL_ENDPOINT_ID}
    auth:
      type: delegated
    operations:
      - name: read
