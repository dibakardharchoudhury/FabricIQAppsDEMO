name: Remediation anchor diagnostics
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/remediation-diagnostics.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Capture remediation traceback
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = Path('.github/workflows/remediate-final-review.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          result = subprocess.run(['python', '-c', script], text=True, capture_output=True)
          report = f'exit={result.returncode}\n--- stdout ---\n{result.stdout}\n--- stderr ---\n{result.stderr}'
          Path('.github/remediation-counts.txt').write_text(report, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/remediation-counts.txt
          git commit -m "Record remediation traceback"
          git push origin HEAD:feat/weather-operations