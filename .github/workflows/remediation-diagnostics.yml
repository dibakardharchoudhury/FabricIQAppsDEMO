name: Clean temporary remediation artifacts
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/remediation-diagnostics.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Compact raw notebook and validate contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(notebook, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python -m unittest Raw/workspace-reset/test_weather_source_contracts.py
      - name: Remove temporary artifacts and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remediate-final-review.yml .github/workflows/remediation-diagnostics.yml .github/remediation-counts.txt
          git add Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb
          git commit -m "Remove temporary remediation artifacts"
          git push origin HEAD:feat/weather-operations