name: Remediation anchor diagnostics
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/remediation-diagnostics.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact remediation script
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/remediate-final-review.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          exec(compile(script, 'exact-head-remediation', 'exec'))
          PY
      - name: Install Python dependencies
        run: python -m pip install -r Raw/workspace-reset/requirements.txt
      - name: Validate remediation
        run: |
          python -m unittest Raw/workspace-reset/test_weather_source_contracts.py
          cd Raw/workspace-reset
          python -m unittest test_sync_workspace_from_git.py
          cd ../../HydroOperationsApp
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          node --test scripts/*.test.mjs
      - name: Commit validated product fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydroOperationsApp Raw Notebooks
          git commit -m "Resolve final weather review findings"
          git push origin HEAD:feat/weather-operations