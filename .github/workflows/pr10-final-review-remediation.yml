name: PR 10 final review remediation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-final-review-remediation.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Apply direct review fixes
        shell: python
        run: |
          import json
          from pathlib import Path

          def one(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one match for {old[:60]!r}, found {text.count(old)}")
              return text.replace(old, new)

          path = Path("Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py")
          text = path.read_text(encoding="utf-8")
          text = one(text, "        raise RuntimeError(f\"No UKMet Land Observation station found for {point['location_id']}\")", "        print(f\"No UKMet Land Observation station near {point['location_id']}; keeping its forecasts only\")\n        continue")
          path.write_text(text, encoding="utf-8")

          path = Path("HydroOperationsApp/src/ui-shared/pages/WeatherPage.tsx")
          text = path.read_text(encoding="utf-8")
          text = one(text, "Observed conditions and 72-hour Aurora forecasts at each asset and within its 20 km operating area.", "Observed conditions and forecasts at each asset and within its 20 km operating area.")
          path.write_text(text, encoding="utf-8")

          path = Path("Raw/workspace-reset/sync_workspace_from_git.py")
          text = path.read_text(encoding="utf-8")
          begin = text.index("def rebind_weather_notebooks(")
          end = text.index("def configure_weather_schedule(", begin)
          replacement = [
              "def rebind_weather_notebooks(", "    fab: Fabric,", "    workspace_id: str,", "    notebooks: dict[str, dict[str, Any]],", "    items: list[dict[str, Any]],", "    environment_id: str,", ") -> bool:", "    \"\"\"Re-apply notebook bindings and report whether dependencies are ready.\"\"\"", "    lakehouses = [", "        item", "        for item in items", "        if item.get(\"type\") == \"Lakehouse\"", "        and str(item.get(\"displayName\", \"\")).startswith(WEATHER_LAKEHOUSE_PREFIX)", "    ]", "    if not lakehouses:", "        print(", "            f\"No '{WEATHER_LAKEHOUSE_PREFIX}*' lakehouse yet; \"", "            \"RTI_001 will bind the weather notebooks when the setup pipeline runs.\"", "        )", "        return False", "    if len(lakehouses) > 1:", "        names = \", \".join(sorted(str(item.get(\"displayName\")) for item in lakehouses))", "        raise SystemExit(", "            f\"Cannot rebind weather notebooks: several '{WEATHER_LAKEHOUSE_PREFIX}*' \"", "            f\"lakehouses exist ({names}).\"", "        )", "", "    lakehouse = lakehouses[0]", "    wanted_lakehouse = {", "        \"default_lakehouse\": lakehouse[\"id\"],", "        \"default_lakehouse_name\": lakehouse[\"displayName\"],", "        \"default_lakehouse_workspace_id\": workspace_id,", "        \"known_lakehouses\": [{\"id\": lakehouse[\"id\"]}],", "    }", "    wanted_environment = {\"environmentId\": environment_id, \"workspaceId\": workspace_id}", "", "    for name, item in sorted(notebooks.items()):", "        definition = notebook_definition(fab, workspace_id, item[\"id\"])", "        part = next(", "            (part for part in definition.get(\"parts\", []) if str(part.get(\"path\", \"\")).endswith(\".ipynb\")),", "            None,", "        )", "        if part is None:", "            raise SystemExit(f\"Notebook '{name}' has no .ipynb definition part.\")", "        content = json.loads(base64.b64decode(part[\"payload\"]))", "        dependencies = content.setdefault(\"metadata\", {}).setdefault(\"dependencies\", {})", "        if dependencies.get(\"lakehouse\") == wanted_lakehouse and dependencies.get(\"environment\") == wanted_environment:", "            print(f\"  {name}: already bound.\")", "            continue", "        dependencies[\"lakehouse\"] = wanted_lakehouse", "        dependencies[\"environment\"] = wanted_environment", "        part[\"payload\"] = base64.b64encode(json.dumps(content).encode(\"utf-8\")).decode(\"ascii\")", "        part[\"payloadType\"] = \"InlineBase64\"", "        response = fab.poll_lro(fab.request(", "            \"POST\",", "            f\"{FABRIC_BASE}/workspaces/{workspace_id}/notebooks/{item['id']}/updateDefinition?updateMetadata=true\",", "            json={\"definition\": definition},", "        ))", "        if response.status_code not in (200, 202):", "            raise SystemExit(f\"Failed to bind notebook '{name}': HTTP {response.status_code} {response.text}\")", "        print(f\"  {name}: bound to '{lakehouse['displayName']}' and Environment.\")", "    return True", "", "", "def weather_schedule_matches(schedule: dict[str, Any]) -> bool:", "    \"\"\"Return whether an unexpired schedule matches the required six-hour UTC offset.\"\"\"", "    configuration = schedule.get(\"configuration\") or {}", "    def parse_utc(value: Any) -> datetime | None:", "        if not isinstance(value, str) or not value.strip():", "            return None", "        value = value.strip().replace(\"Z\", \"+00:00\")", "        try:", "            parsed = datetime.fromisoformat(value)", "        except ValueError:", "            return None", "        return parsed.astimezone(timezone.utc) if parsed.tzinfo else None", "    start = parse_utc(configuration.get(\"startDateTime\"))", "    end_time = parse_utc(configuration.get(\"endDateTime\"))", "    if start is None or end_time is None:", "        return False", "    minutes = start.hour * 60 + start.minute", "    return (schedule.get(\"enabled\") is True", "        and end_time > datetime.now(timezone.utc)", "        and configuration.get(\"type\") == \"Cron\"", "        and configuration.get(\"interval\") == WEATHER_SCHEDULE_INTERVAL_MINUTES", "        and configuration.get(\"localTimeZoneId\") == \"UTC\"", "        and start.second == 0 and start.microsecond == 0", "        and minutes % WEATHER_SCHEDULE_INTERVAL_MINUTES == WEATHER_SCHEDULE_OFFSET_MINUTES)", "", "",
          ]
          text = text[:begin] + "\n".join(replacement) + text[end:]
          old = "    rebind_weather_notebooks(fab, workspace_id, weather_notebooks, items, environment_id)\n\n    # Activate the recurring job only after its runtime and dependencies are ready.\n    configure_weather_schedule(fab, workspace_id, weather_pipelines[0][\"id\"])"
          new = "    bindings_ready = rebind_weather_notebooks(fab, workspace_id, weather_notebooks, items, environment_id)\n\n    # Activate the recurring job only after its runtime and dependencies are ready.\n    if bindings_ready:\n        configure_weather_schedule(fab, workspace_id, weather_pipelines[0][\"id\"])\n    else:\n        print(f\"{WEATHER_PIPELINE_NAME} schedule deferred until notebook dependencies are ready.\")"
          text = one(text, old, new)
          path.write_text(text, encoding="utf-8")

          canonical = Path("Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py").read_text(encoding="utf-8")
          start = "GRAPHQL_OBJECTS = ["; stop = "\n\nOPERATIONAL_INSTRUCTIONS_MARKER"
          block = canonical[canonical.index(start):canonical.index(stop)]
          path = Path("Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          cells = [cell for cell in notebook["cells"] if start in "".join(cell.get("source", []))]
          if len(cells) != 1: raise RuntimeError("Raw RTI_011 GraphQL cell not unique")
          source = "".join(cells[0]["source"])
          source = source[:source.index(start)] + block + source[source.index(stop):]
          source = source.replace("these four silver tables", "the configured silver, canonical weather, and serving weather tables")
          source = source.replace("the four silver tables the web app queries", "the configured silver, canonical weather, and serving weather tables")
          source = source.replace("object(s) over dbo silver tables", "object(s) over dbo Lakehouse tables")
          cells[0]["source"] = source.splitlines(keepends=True)
          path.write_text(json.dumps(notebook, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

          path = Path("Raw/workspace-reset/test_sync_workspace_from_git.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"startDateTime": "2026-09-16T03:20:00Z",', '"startDateTime": "2026-09-16T03:20:00Z",\n                            "endDateTime": "2036-09-16T03:20:00Z",')
          marker = '        self.assertIn("RTI_001 will bind the weather notebooks", output.getvalue())'
          text = one(text, marker, marker + '\n        self.assertFalse(any("/jobs/Pipeline/schedules" in url for _, url in fabric.requests))')
          path.write_text(text, encoding="utf-8")

          Path(".github/pr10-validation-diagnostic.txt").unlink(missing_ok=True)
      - name: Validate Python
        run: |
          python Raw/workspace-reset/test_weather_source_contracts.py
          cd Raw/workspace-reset
          python test_sync_workspace_from_git.py
          python -m py_compile sync_workspace_from_git.py ../../Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py
      - name: Validate Node 24 dependencies and frontend
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - working-directory: HydroOperationsApp
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          node --test scripts/agent-response.test.mjs scripts/artifact-discovery.test.mjs scripts/assistant-stream.test.mjs scripts/copilot-tools.test.mjs scripts/setup-live-auth.test.mjs scripts/single-flight.test.mjs
      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/pr10-final-review-remediation.yml .github/workflows/pr10-validation-diagnose.yml
          git add -A
          git commit -m "Resolve final weather review findings"
          git push origin HEAD:feat/weather-operations
