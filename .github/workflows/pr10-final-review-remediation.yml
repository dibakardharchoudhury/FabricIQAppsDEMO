name: PR 10 final review remediation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-final-review-remediation.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Apply fixes with corrected generated blocks
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          previous = subprocess.check_output(
              ["git", "show", "dd3be20beb0d2e5d487872557136c7e87611438c:.github/workflows/pr10-final-review-remediation.yml"],
              text=True,
          )
          script = previous.split("      - name: Apply review fixes\n        shell: python\n        run: |\n", 1)[1].split("      - name: Validate remediation\n", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, "remediation.py", "exec"))

          def replace_block(path, start_marker, end_marker, lines):
              text = path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(text[:start] + "\n".join(lines) + "\n\n" + text[end:], encoding="utf-8")

          replace_block(
              Path("Raw/workspace-reset/sync_workspace_from_git.py"),
              "def weather_schedule_matches(",
              "def configure_weather_schedule(",
              [
                  "def weather_schedule_matches(schedule: dict[str, Any]) -> bool:",
                  "    \"\"\"Return whether an unexpired schedule matches the required six-hour UTC offset.\"\"\"",
                  "    configuration = schedule.get(\"configuration\") or {}",
                  "",
                  "    def parse_utc(value: Any) -> datetime | None:",
                  "        if not isinstance(value, str) or not value.strip():",
                  "            return None",
                  "        normalized = value.strip()",
                  "        if normalized.endswith(\"Z\"):",
                  "            normalized = f\"{normalized[:-1]}+00:00\"",
                  "        try:",
                  "            parsed = datetime.fromisoformat(normalized)",
                  "        except ValueError:",
                  "            return None",
                  "        return parsed.astimezone(timezone.utc) if parsed.tzinfo else None",
                  "",
                  "    start_utc = parse_utc(configuration.get(\"startDateTime\"))",
                  "    end_utc = parse_utc(configuration.get(\"endDateTime\"))",
                  "    if start_utc is None or end_utc is None:",
                  "        return False",
                  "    minutes_past_midnight = start_utc.hour * 60 + start_utc.minute",
                  "    return (",
                  "        schedule.get(\"enabled\") is True",
                  "        and end_utc > datetime.now(timezone.utc)",
                  "        and configuration.get(\"type\") == \"Cron\"",
                  "        and configuration.get(\"interval\") == WEATHER_SCHEDULE_INTERVAL_MINUTES",
                  "        and configuration.get(\"localTimeZoneId\") == \"UTC\"",
                  "        and start_utc.second == 0",
                  "        and start_utc.microsecond == 0",
                  "        and minutes_past_midnight % WEATHER_SCHEDULE_INTERVAL_MINUTES",
                  "        == WEATHER_SCHEDULE_OFFSET_MINUTES",
                  "    )",
              ],
          )

          replace_block(
              Path("Raw/workspace-reset/test_weather_source_contracts.py"),
              "    def test_raw_rti_011_matches_canonical_graphql_objects(self):",
              "    def test_pipeline_and_redirect_contracts_remain_intact(self):",
              [
                  "    def test_raw_rti_011_matches_canonical_graphql_objects(self):",
                  "        canonical = (ROOT / \"Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py\").read_text(encoding=\"utf-8\")",
                  "        raw = json.loads((ROOT / \"Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb\").read_text(encoding=\"utf-8\"))",
                  "        raw_source = \"\".join(\"\".join(cell.get(\"source\", [])) for cell in raw[\"cells\"])",
                  "        start, end = \"GRAPHQL_OBJECTS = [\", \"\\n\\nOPERATIONAL_INSTRUCTIONS_MARKER\"",
                  "        self.assertEqual(canonical[canonical.index(start):canonical.index(end)], raw_source[raw_source.index(start):raw_source.index(end)])",
              ],
          )

          replace_block(
              Path("Raw/workspace-reset/test_sync_workspace_from_git.py"),
              "    def test_expired_weather_schedule_is_updated(self):",
              "    def test_wrong_offset_weather_schedule_is_updated(self):",
              [
                  "    def test_expired_weather_schedule_is_updated(self):",
                  "        fabric = FakeFabric()",
                  "        existing = FakeResponse(200, {\"value\": [{\"id\": \"schedule-id\", \"enabled\": True, \"configuration\": {",
                  "            \"type\": \"Cron\", \"interval\": 360, \"localTimeZoneId\": \"UTC\",",
                  "            \"startDateTime\": \"2026-09-16T03:20:00Z\", \"endDateTime\": \"2026-09-17T03:20:00Z\",",
                  "        }}]})",
                  "        original_request = fabric.request",
                  "        fabric.request = Mock(side_effect=lambda method, url, **kwargs: existing",
                  "            if method == \"GET\" and \"/jobs/Pipeline/schedules\" in url",
                  "            else original_request(method, url, **kwargs))",
                  "        with contextlib.redirect_stdout(io.StringIO()):",
                  "            configure_weather_schedule(fabric, \"workspace-id\", \"weather-pipeline\")",
                  "        patches = [call for call in fabric.request.call_args_list if call.args[0] == \"PATCH\"]",
                  "        self.assertEqual(len(patches), 1)",
              ],
          )
          Path(".github/pr10-validation-diagnostic.txt").unlink(missing_ok=True)
      - name: Validate remediation
        run: |
          python Raw/workspace-reset/test_weather_source_contracts.py
          cd Raw/workspace-reset
          python test_sync_workspace_from_git.py
          python -m py_compile sync_workspace_from_git.py ../../Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py
      - name: Validate frontend dependencies and types
        working-directory: HydroOperationsApp
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          node --test scripts/agent-response.test.mjs scripts/artifact-discovery.test.mjs scripts/assistant-stream.test.mjs scripts/copilot-tools.test.mjs scripts/setup-live-auth.test.mjs scripts/single-flight.test.mjs
      - name: Commit fixes and remove executor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/pr10-final-review-remediation.yml
          git add -A
          git commit -m "Resolve final weather review findings"
          git push origin HEAD:feat/weather-operations
