name: Pinpoint final PR 10 patch guard
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-pinpoint.yml]
permissions:
  contents: write
jobs:
  pinpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
      - shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/pr10-final-findings.yml').read_text()
          start = workflow.index('      - name: Apply remaining fixes and regression tests')
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('\n      - name: Set up Node 24', run_start)
          Path('/tmp/apply.py').write_text(textwrap.dedent(workflow[run_start:end]))
      - shell: python
        run: |
          from pathlib import Path
          try:
              exec(compile(Path('/tmp/apply.py').read_text(), '/tmp/apply.py', 'exec'))
          except BaseException as error:
              Path('.github/pr10-anchor-error.txt').write_text(f'{type(error).__name__}: {error}', encoding='utf-8')
      - shell: bash
        run: |
          test -f .github/pr10-anchor-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr10-anchor-error.txt
          git commit -m "Record PR 10 failing patch guard"
          git push origin HEAD:feat/weather-operations
