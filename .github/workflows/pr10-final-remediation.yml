name: PR 10 final review remediation

on:
  push:
    branches:
      - feat/weather-operations
    paths:
      - .github/workflows/pr10-final-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed changes
        shell: python
        run: |
          from pathlib import Path

          fabric = Path('HydroOperationsApp/src/services/fabric.ts')
          source = fabric.read_text(encoding='utf-8')
          replacements = {
              'first: 10000000000': 'first: 100000',
              'first: 100000000': 'first: 100000',
              'first: 10000000': 'first: 100000',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          weather_query = source.split('query HydroWeather', 1)[1].split('const response', 1)[0]
          assert weather_query.count('first: 100000)') == 5
          fabric.write_text(source, encoding='utf-8')

          contracts = Path('Raw/workspace-reset/test_weather_source_contracts.py')
          source = contracts.read_text(encoding='utf-8')
          old = 'self.assertEqual(weather_query.count("first: 100000"), 5)'
          new = 'self.assertEqual(weather_query.count("first: 100000)"), 5)'
          assert source.count(old) == 1
          contracts.write_text(source.replace(old, new), encoding='utf-8')

          notebook = Path('Notebooks/Weather_002_fetch_area_weather.Notebook/notebook-content.py')
          source = notebook.read_text(encoding='utf-8')
          old = '    response.raise_for_status()\n    features = response.json().get("features", [])'
          new = '''    try:\n        response.raise_for_status()\n    except requests.HTTPError:\n        raise RuntimeError(\n            f"Aurora STAC search failed with HTTP {response.status_code}"\n        ) from None\n    features = response.json().get("features", [])'''
          assert source.count(old) == 1
          notebook.write_text(source.replace(old, new), encoding='utf-8')
      - name: Validate weather contracts
        run: python -m unittest Raw/workspace-reset/test_weather_source_contracts.py
      - name: Install app dependencies
        working-directory: HydroOperationsApp
        run: npm ci
      - name: Validate TypeScript
        working-directory: HydroOperationsApp
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Commit fixes and remove executor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr10-final-remediation.yml
          git add HydroOperationsApp/src/services/fabric.ts Notebooks/Weather_002_fetch_area_weather.Notebook/notebook-content.py Raw/workspace-reset/test_weather_source_contracts.py
          git commit -m "Fix final weather review blockers"
          git push origin HEAD:feat/weather-operations
