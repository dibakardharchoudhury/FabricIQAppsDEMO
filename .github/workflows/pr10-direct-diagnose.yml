name: Diagnose direct remediation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-direct-diagnose.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
      - shell: python
        run: |
          import subprocess
          from pathlib import Path
          raw = Path('.github/workflows/pr10-final-review-remediation.yml').read_text(encoding='utf-8')
          block = raw.split('      - name: Apply direct review fixes\n        shell: python\n        run: |\n', 1)[1].split('      - name: Validate Python\n', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'direct.py', 'exec'))
          checks = [(['python','Raw/workspace-reset/test_weather_source_contracts.py'],None),(['python','test_sync_workspace_from_git.py'],'Raw/workspace-reset'),(['python','-m','py_compile','sync_workspace_from_git.py','../../Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py'],'Raw/workspace-reset')]
          report=[]
          for command,cwd in checks:
              result=subprocess.run(command,cwd=cwd,text=True,capture_output=True)
              report.append(f"$ {' '.join(command)}\nexit={result.returncode}\n{result.stdout}\n{result.stderr}")
          Path('.github/pr10-direct-diagnostic.txt').write_text('\n\n'.join(report),encoding='utf-8')
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/pr10-direct-diagnose.yml
          git add .github/pr10-direct-diagnostic.txt .github/workflows/pr10-direct-diagnose.yml
          git commit -m "Capture direct remediation test output"
          git push origin HEAD:feat/weather-operations
