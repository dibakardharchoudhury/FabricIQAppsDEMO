name: Diagnose PR 10 review patch

on:
  push:
    branches:
      - feat/weather-operations
    paths:
      - .github/workflows/pr10-review-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay patch and annotate failure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/pr10-review-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          result = subprocess.run(
              ['python', '-c', script],
              text=True,
              capture_output=True,
          )
          detail = (result.stderr or result.stdout or 'patch failed without output').strip()
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          if result.returncode:
              print(f'::error title=Guarded patch failure::{detail}')
          else:
              print('::notice title=Guarded patch replay::All replacements applied in the ephemeral checkout')
          PY
