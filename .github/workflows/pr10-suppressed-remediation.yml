name: PR 10 suppressed review remediation

on:
  push:
    branches:
      - feat/weather-operations
    paths:
      - .github/workflows/pr10-suppressed-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply suppressed review fixes
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              assert source.count(old) == 1, (path, source.count(old), old)
              file.write_text(source.replace(old, new), encoding='utf-8')

          replace_once(
              'HydroOperationsApp/src/ui-shared/weatherSummary.ts',
              "  const contiguous = includedIndexes.every((index, offset) => index === firstIndex + offset)\n",
              """  const contiguous = includedIndexes.every((index, offset) => {\n    if (index !== firstIndex + offset || index === 0) return false\n    const currentEnd = Date.parse(ordered[index].valid_time_utc)\n    const previousEnd = Date.parse(ordered[index - 1].valid_time_utc)\n    const intervalMs = Number(ordered[index].precipitation_interval_hours) * 3_600_000\n    return Number.isFinite(currentEnd)\n      && Number.isFinite(previousEnd)\n      && Number.isFinite(intervalMs)\n      && currentEnd - previousEnd === intervalMs\n  })\n""",
          )

          summary_test = Path('HydroOperationsApp/scripts/weather-summary.test.ts')
          source = summary_test.read_text(encoding='utf-8')
          addition = """\n\ntest('falls back to bucket sums when cumulative rows span a timestamp gap', () => {\n  const summary = summarizePrecipitation([\n    { valid_time_utc: at(2), precipitation_interval_hours: 6, precipitation: 5, cumulative_precipitation: 5 },\n    { valid_time_utc: at(8), precipitation_interval_hours: 6, precipitation: 6, cumulative_precipitation: 11 },\n    { valid_time_utc: at(20), precipitation_interval_hours: 6, precipitation: 3, cumulative_precipitation: 18 },\n  ], anchor, 24)\n  assert.deepEqual(summary, { amount: 9, volume: undefined, coveredHours: 12 })\n})\n"""
          assert "falls back to bucket sums when cumulative rows span a timestamp gap" not in source
          summary_test.write_text(source.rstrip() + addition, encoding='utf-8')

          pagination_old = '        url = body.get("continuationUri")\n'
          pagination_new = '''        url = body.get("continuationUri")\n        if not url and body.get("continuationToken"):\n            token = body["continuationToken"]\n            url = (\n                f"{FABRIC_BASE_URL}/workspaces/{workspace_id}/items"\n                f"?continuationToken={token}"\n            )\n'''
          replace_once(
              'Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py',
              pagination_old,
              pagination_new,
          )

          raw_path = Path('Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb')
          notebook = json.loads(raw_path.read_text(encoding='utf-8'))
          changed = 0
          for cell in notebook['cells']:
              source = ''.join(cell.get('source', []))
              if pagination_old in source:
                  assert source.count(pagination_old) == 1
                  cell['source'] = source.replace(pagination_old, pagination_new).splitlines(keepends=True)
                  changed += 1
          assert changed == 1
          raw_path.write_text(json.dumps(notebook, indent=1, ensure_ascii=True) + '\n', encoding='utf-8')

          replace_once(
              'Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py',
              'if not observation_rows:\n    raise RuntimeError("UKMet Land Observations returned no mapped recent values")\n',
              'if not observation_rows:\n    print("UKMet Land Observations returned no mapped recent values; keeping forecast ingestion")\n',
          )

          graphql = Path('Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py')
          source = graphql.read_text(encoding='utf-8')
          replacements = {
              '# must expose these four silver tables with these fields (identity-mapped to the\n# lakehouse columns). graphqlType == the generated query field name.': '# must expose the configured silver, canonical weather, and serving weather tables with\n# these fields (identity-mapped to the lakehouse columns). graphqlType is the generated query field name.',
              '    """graphql-definition.json binding the STID GraphQL API to the Lakehouse SQL analytics\n    endpoint, exposing the four silver tables the web app queries."""': '    """Bind the app GraphQL API to the Lakehouse SQL analytics endpoint, exposing\n    the configured silver, canonical weather, and serving weather tables."""',
              '    # Bind the GraphQL API to the Lakehouse SQL analytics endpoint and expose the four\n    # silver tables the web app queries (silver_facilities / silver_systems /\n    # silver_equipment / silver_instruments). Without this the GraphQL item is created empty.': '    # Bind the GraphQL API to the Lakehouse SQL analytics endpoint and expose every\n    # silver, canonical weather, and serving weather table in GRAPHQL_OBJECTS.',
              'print(f"Applying GraphQL definition: {len(GRAPHQL_OBJECTS)} object(s) over dbo silver tables")': 'print(f"Applying GraphQL definition: {len(GRAPHQL_OBJECTS)} object(s) over dbo Lakehouse tables")',
              '        f"endpoint of \'{lakehouse_name}\' → expose silver_facilities / silver_systems / "\n        "silver_equipment / silver_instruments."': '        f"endpoint of \'{lakehouse_name}\' → expose every table listed in GRAPHQL_OBJECTS."',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, (source.count(old), old)
              source = source.replace(old, new)
          graphql.write_text(source, encoding='utf-8')

          sync_path = Path('Raw/workspace-reset/sync_workspace_from_git.py')
          source = sync_path.read_text(encoding='utf-8')
          schedule_call = '    configure_weather_schedule(fab, workspace_id, weather_pipelines[0]["id"])\n\n'
          assert source.count(schedule_call) == 1
          source = source.replace(schedule_call, '', 1)
          binding = '    rebind_weather_notebooks(fab, workspace_id, weather_notebooks, items, environment_id)\n\n'
          assert source.count(binding) == 1
          source = source.replace(
              binding,
              binding + '    # Activate the recurring job only after its runtime and dependencies are ready.\n    configure_weather_schedule(fab, workspace_id, weather_pipelines[0]["id"])\n\n',
          )
          incomplete_cli = '    print("  CLI: az keyvault secret set --vault-name <vault> --name <secret-name>")\n'
          assert source.count(incomplete_cli) == 1
          source = source.replace(incomplete_cli, '')
          sync_path.write_text(source, encoding='utf-8')

          contracts = Path('Raw/workspace-reset/test_weather_source_contracts.py')
          source = contracts.read_text(encoding='utf-8')
          marker = '    def test_pipeline_and_redirect_contracts_remain_intact(self):\n'
          assert source.count(marker) == 1
          tests = '''    def test_setup_pagination_and_observation_fallbacks(self):\n        setup = (ROOT / "Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py").read_text(encoding="utf-8")\n        raw = json.loads((ROOT / "Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb").read_text(encoding="utf-8"))\n        raw_source = "\\n".join("".join(cell.get("source", [])) for cell in raw["cells"])\n        fallback = 'if not url and body.get("continuationToken")'\n        self.assertEqual(setup.count(fallback), 1)\n        self.assertEqual(raw_source.count(fallback), 1)\n        ukmet = (ROOT / "Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py").read_text(encoding="utf-8")\n        self.assertNotIn('raise RuntimeError("UKMet Land Observations returned no mapped recent values")', ukmet)\n        self.assertIn("keeping forecast ingestion", ukmet)\n\n'''
          contracts.write_text(source.replace(marker, tests + marker), encoding='utf-8')

          sync_test = Path('Raw/workspace-reset/test_sync_workspace_from_git.py')
          source = sync_test.read_text(encoding='utf-8')
          marker = '    def test_missing_lakehouse_defers_binding_to_rti_001(self):\n'
          assert source.count(marker) == 1
          test = '''    def test_schedule_is_configured_after_notebook_dependencies(self):\n        fabric = FakeFabric()\n        with contextlib.redirect_stdout(io.StringIO()):\n            configure_weather_assets(fabric, "workspace-id", git_updated=True)\n\n        schedule_index = next(\n            index for index, (method, url) in enumerate(fabric.requests)\n            if method == "POST" and "/jobs/Pipeline/schedules" in url\n        )\n        dependency_indexes = [\n            index for index, (method, url) in enumerate(fabric.requests)\n            if method == "POST" and ("/staging/publish" in url or "/updateDefinition" in url)\n        ]\n        self.assertTrue(dependency_indexes)\n        self.assertGreater(schedule_index, max(dependency_indexes))\n\n'''
          sync_test.write_text(source.replace(marker, test + marker), encoding='utf-8')

          docs = Path('docs/weather-fabric-port-plan.md')
          source = docs.read_text(encoding='utf-8')
          assert source.count('The three notebooks are deployable Fabric Git items:') == 1
          source = source.replace('The three notebooks are deployable Fabric Git items:', 'The four notebooks are deployable Fabric Git items:')
          docs.write_text(source, encoding='utf-8')
      - name: Validate Python contracts
        run: python -m unittest Raw/workspace-reset/test_weather_source_contracts.py
      - name: Validate provisioning tests
        working-directory: Raw/workspace-reset
        run: python -m unittest test_sync_workspace_from_git.py
      - name: Install app dependencies
        working-directory: HydroOperationsApp
        run: npm ci
      - name: Validate precipitation summary
        working-directory: HydroOperationsApp
        run: node --import tsx --test ./scripts/weather-summary.test.ts
      - name: Validate TypeScript
        working-directory: HydroOperationsApp
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Commit fixes and remove executor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr10-suppressed-remediation.yml
          git add HydroOperationsApp/scripts/weather-summary.test.ts HydroOperationsApp/src/ui-shared/weatherSummary.ts Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb Raw/workspace-reset/sync_workspace_from_git.py Raw/workspace-reset/test_sync_workspace_from_git.py Raw/workspace-reset/test_weather_source_contracts.py docs/weather-fabric-port-plan.md
          git commit -m "Address suppressed weather review findings"
          git push origin HEAD:feat/weather-operations
