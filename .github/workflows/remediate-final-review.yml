name: Remediate final Copilot review
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/remediate-final-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-head review fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          fabric = "HydroOperationsApp/src/services/fabric.ts"
          replace(fabric,
              "const weatherSetupNotebookName = 'Weather_001_create_lakehouse'\nconst weatherAreaNotebookName = 'Weather_002_fetch_area_weather'\nconst weatherUkmetNotebookName = 'Weather_003_fetch_ukmet'\nconst weatherAreaCalculationsNotebookName = 'Weather_020_area_calculations'",
              "const weatherPipelineName = '03_Pipe_Weather'")
          replace(fabric,
              "const weatherNotebookNames = [weatherSetupNotebookName, weatherAreaNotebookName, weatherUkmetNotebookName, weatherAreaCalculationsNotebookName]\n\nasync function runWeatherSequence(onStatus?: JobProgress, resumeSinceIso?: string): Promise<JobStatus> {\n  for (const [index, name] of weatherNotebookNames.entries()) {\n    const notebookId = await resolveNotebookId(name)\n    // On resume, skip the notebooks that already finished earlier in this same sequence.\n    if (resumeSinceIso && (await statusSince(notebookId, resumeSinceIso)) === 'Completed') continue\n    const isLast = index === weatherNotebookNames.length - 1\n    // A mid-sequence 'Completed' would pin the caller's progress bar at 100%, so only the last one reports it.\n    const report = onStatus && ((status: JobStatus) => onStatus(status === 'Completed' && !isLast ? 'InProgress' : status))\n    const status = await runJob(notebookId, 'RunNotebook', report, { timeoutMs: 20 * 60_000, reuseActive: true })\n    if (status !== 'Completed') return status\n  }",
              "async function resolveWeatherPipelineId(): Promise<string> {\n  const token = await fabricToken(true)\n  if (!token) throw new Error('Fabric sign-in is required.')\n  const items = await listItems(token)\n  const pipeline = items.find(item => (item.type === 'DataPipeline' || item.type === 'Pipeline') && item.displayName === weatherPipelineName)\n  if (!pipeline) throw new Error(`The ${weatherPipelineName} pipeline was not found in the workspace.`)\n  return pipeline.id\n}\n\nasync function runWeatherSequence(onStatus?: JobProgress, resumeSinceIso?: string): Promise<JobStatus> {\n  const pipelineId = await resolveWeatherPipelineId()\n  const alreadyCompleted = resumeSinceIso && (await statusSince(pipelineId, resumeSinceIso)) === 'Completed'\n  if (!alreadyCompleted) {\n    const pipelineStatus = await runJob(pipelineId, 'Pipeline', onStatus, { timeoutMs: 80 * 60_000, reuseActive: true })\n    if (pipelineStatus !== 'Completed') return pipelineStatus\n  }")
          replace(fabric,
              "/** Create tables, ingest Aurora and UKMet, then calculate vendor-specific area metrics. */",
              "/** Run the coordinated weather pipeline, then republish GraphQL over its completed tables. */")
          replace(fabric,
              "/** Resume a weather sequence started before a page reload, continuing from the first unfinished notebook. */",
              "/** Resume the coordinated weather pipeline started before a page reload. */")

          page = "HydroOperationsApp/src/ui-shared/pages/WeatherPage.tsx"
          replace(page, "const [showMoreVariables, setShowMoreVariables] = useState(false)", "const [showMoreVariables, setShowMoreVariables] = useState(true)")
          replace(page,
              "  const secondaryVariables = [...new Set(rows.flatMap(row => row.values.map(value => value.variableId)).filter(variableId => !PRIMARY_VARIABLES.has(variableId)))]\n    .sort((left, right) => variableRank(left) - variableRank(right) || left.localeCompare(right))",
              "  const secondaryVariables = VARIABLE_ORDER.filter(variableId => !PRIMARY_VARIABLES.has(variableId))")

          sync = "Raw/workspace-reset/sync_workspace_from_git.py"
          replace(sync, "from typing import Any", "from typing import Any\nfrom urllib.parse import quote")
          replace(sync, "continuationToken={token}", "continuationToken={quote(token, safe='')}", count=3)
          replace(sync,
              "def configure_weather_schedule(fab: Fabric, workspace_id: str, pipeline_id: str) -> None:\n    \"\"\"Ensure the weather pipeline has an enabled six-hour recurring UTC schedule.\"\"\"",
              "def configure_weather_schedule(\n    fab: Fabric, workspace_id: str, pipeline_id: str, enabled: bool = True\n) -> None:\n    \"\"\"Ensure the weather pipeline has a six-hour recurring UTC schedule.\"\"\"")
          replace(sync, '        "enabled": True,', '        "enabled": enabled,')
          replace(sync,
              "    # Activate the recurring job only after its runtime and dependencies are ready.\n    if bindings_ready:\n        configure_weather_schedule(fab, workspace_id, weather_pipelines[0][\"id\"])\n    else:\n        print(f\"{WEATHER_PIPELINE_NAME} schedule deferred until notebook dependencies are ready.\")",
              "    # A fresh workspace gets the cadence now, but it remains disabled until RTI_001\n    # creates the lakehouse and successfully binds every weather notebook.\n    configure_weather_schedule(\n        fab, workspace_id, weather_pipelines[0][\"id\"], enabled=bindings_ready\n    )\n    if not bindings_ready:\n        print(f\"{WEATHER_PIPELINE_NAME} schedule created disabled until notebook dependencies are ready.\")")

          setup = "Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py"
          replace(setup, "import json\nimport requests\nimport notebookutils", "import json\nimport requests\nimport notebookutils\nfrom urllib.parse import quote")
          replace(setup, "continuationToken={token}", "continuationToken={quote(token, safe='')}")
          activation = '''\n\ndef _activate_weather_schedule() -> None:\n    pipeline_id = _workspace_item_id("03_Pipe_Weather", "DataPipeline")\n    base = (\n        f"{FABRIC_BASE_URL}/workspaces/{workspace_id}/items/{pipeline_id}"\n        "/jobs/Pipeline/schedules"\n    )\n    headers = {"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"}\n    response = requests.get(base, headers=headers)\n    if response.status_code != 200:\n        raise RuntimeError(f"Failed to inspect weather schedule (HTTP {response.status_code}): {response.text}")\n    schedules = response.json().get("value", [])\n    if len(schedules) != 1 or not schedules[0].get("id"):\n        raise RuntimeError(f"Expected one provisioned weather schedule, found {len(schedules)}")\n    schedule = schedules[0]\n    if schedule.get("enabled") is True:\n        return\n    updated = requests.patch(\n        f"{base}/{schedule['id']}", headers=headers,\n        json={"enabled": True, "configuration": schedule.get("configuration") or {}},\n    )\n    if updated.status_code not in (200, 201):\n        raise RuntimeError(f"Failed to enable weather schedule (HTTP {updated.status_code}): {updated.text}")\n\n\n_activate_weather_schedule()\n'''
          replace(setup,
              "if weather_binding_failures:\n    raise RuntimeError(\n        \"Required weather notebook binding failed: \"\n        + \"; \".join(f\"{name}: {detail}\" for name, detail in weather_binding_failures)\n    )\n\nprint(",
              "if weather_binding_failures:\n    raise RuntimeError(\n        \"Required weather notebook binding failed: \"\n        + \"; \".join(f\"{name}: {detail}\" for name, detail in weather_binding_failures)\n    )" + activation + "\nprint(")

          gql = "Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py"
          weather_anchor = '''        ("weather_locations",\n         ["location_id", "location_name", "latitude", "longitude", "elevation_m",\n            "metadata_json", "updated_at_utc"]),'''
          weather_objects = '''        ("weather_sources",\n         ["source_id", "source_name", "source_type", "provider", "license", "endpoint",\n            "active", "updated_at_utc"]),\n        ("weather_ingestion_runs",\n         ["run_id", "source_id", "source_item_id", "data_kind", "reference_time_utc",\n            "started_at_utc", "completed_at_utc", "status", "row_count", "error_message"]),\n''' + weather_anchor
          replace(gql, weather_anchor, weather_objects)

          health = "Notebooks/Weather_020_area_calculations.Notebook/notebook-content.py"
          replace(health,
              "# The pipeline continues past a failed vendor, so freshness is the only signal that one stopped.\nhealth = (",
              "# Track source issue age separately from operational run completion.\nlatest_issues = (\n    spark.table(TABLES[\"forecasts\"])\n    .groupBy(\"source_id\")\n    .agg(F.max(\"reference_time_utc\").alias(\"latest_issue_utc\"))\n)\nhealth = (")
          replace(health,
              "    )\n)\ndisplay(health)\n\nstale = health.filter(\n    F.col(\"last_success_utc\").isNull()\n    | (F.col(\"last_success_utc\") < F.current_timestamp() - F.expr(f\"INTERVAL {staleness_hours} HOURS\"))\n).collect()\nfor row in stale:\n    print(\n        f\"WARNING: vendor '{row['source_id']}' has no successful run in the last \"\n        f\"{staleness_hours}h (last success: {row['last_success_utc']})\"\n    )",
              "    )\n    .join(latest_issues, \"source_id\", \"left\")\n)\ndisplay(health)\n\nstale = health.filter(\n    F.col(\"latest_issue_utc\").isNull()\n    | (F.col(\"latest_issue_utc\") < F.current_timestamp() - F.expr(f\"INTERVAL {staleness_hours} HOURS\"))\n).collect()\nfor row in stale:\n    print(\n        f\"WARNING: vendor '{row['source_id']}' has no forecast issue in the last \"\n        f\"{staleness_hours}h (latest issue: {row['latest_issue_utc']}; \"\n        f\"last successful run: {row['last_success_utc']})\"\n    )")

          def patch_ipynb(path, transforms):
              file = Path(path)
              notebook = json.loads(file.read_text(encoding="utf-8"))
              source = "".join("".join(cell.get("source", [])) for cell in notebook["cells"])
              for old, new, expected in transforms:
                  if source.count(old) != expected:
                      raise RuntimeError(f"{path}: expected {expected} notebook matches for {old[:80]!r}, got {source.count(old)}")
                  remaining = expected
                  for cell in notebook["cells"]:
                      text = "".join(cell.get("source", []))
                      hits = text.count(old)
                      if hits:
                          text = text.replace(old, new)
                          cell["source"] = text.splitlines(keepends=True)
                          remaining -= hits
                  if remaining:
                      raise RuntimeError(f"{path}: transform crossed cell boundary")
                  source = source.replace(old, new)
              file.write_text(json.dumps(notebook, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")

          patch_ipynb("Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb", [
              ("import json\nimport requests\nimport notebookutils", "import json\nimport requests\nimport notebookutils\nfrom urllib.parse import quote", 1),
              ("continuationToken={token}", "continuationToken={quote(token, safe='')}", 1),
              ("if weather_binding_failures:\n    raise RuntimeError(\n        \"Required weather notebook binding failed: \"\n        + \"; \".join(f\"{name}: {detail}\" for name, detail in weather_binding_failures)\n    )\n\nprint(", "if weather_binding_failures:\n    raise RuntimeError(\n        \"Required weather notebook binding failed: \"\n        + \"; \".join(f\"{name}: {detail}\" for name, detail in weather_binding_failures)\n    )" + activation + "\nprint(", 1),
          ])
          patch_ipynb("Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb", [
              (weather_anchor, weather_objects, 1),
          ])

          tests = "Raw/workspace-reset/test_weather_source_contracts.py"
          replace(tests,
              "        self.assertGreater(weather_sequence.index(\"weatherNotebookNames.entries()\"), -1)\n        self.assertGreater(weather_sequence.index(\"resolvePostseedNotebookId()\"), weather_sequence.index(\"weatherNotebookNames.entries()\"))",
              "        self.assertIn(\"resolveWeatherPipelineId()\", weather_sequence)\n        self.assertIn(\"runJob(pipelineId, 'Pipeline'\", weather_sequence)\n        self.assertNotIn(\"weatherNotebookNames.entries()\", weather_sequence)\n        self.assertGreater(weather_sequence.index(\"resolvePostseedNotebookId()\"), weather_sequence.index(\"runJob(pipelineId, 'Pipeline'\"))")
          replace(tests,
              "        self.assertIn(\"stillAvailable\", page)",
              "        self.assertIn(\"stillAvailable\", page)\n        self.assertIn(\"useState(true)\", page)\n        self.assertIn(\"VARIABLE_ORDER.filter(variableId => !PRIMARY_VARIABLES.has(variableId))\", page)")
          replace(tests,
              "        self.assertEqual(raw_source.count(marker), 1)",
              "        self.assertEqual(raw_source.count(marker), 1)\n        self.assertEqual(canonical.count(\"quote(token, safe='')\"), 1)\n        self.assertEqual(raw_source.count(\"quote(token, safe='')\"), 1)\n        self.assertEqual(canonical.count(\"_activate_weather_schedule()\"), 2)\n        self.assertEqual(raw_source.count(\"_activate_weather_schedule()\"), 2)\n        graphql = (ROOT / \"Notebooks/RTI_011_seed_sql_wire_graphql_agent.Notebook/notebook-content.py\").read_text(encoding=\"utf-8\")\n        raw_graphql = json.loads((ROOT / \"Raw/RTI_Notebooks/RTI_011_seed_sql_wire_graphql_agent.ipynb\").read_text(encoding=\"utf-8\"))\n        raw_graphql_source = \"\".join(\"\".join(cell.get(\"source\", [])) for cell in raw_graphql[\"cells\"])\n        for object_name in (\"weather_sources\", \"weather_ingestion_runs\"):\n            self.assertEqual(graphql.count(f'(\"{object_name}\"'), 1)\n            self.assertEqual(raw_graphql_source.count(f'(\"{object_name}\"'), 1)\n        metrics = (ROOT / \"Notebooks/Weather_020_area_calculations.Notebook/notebook-content.py\").read_text(encoding=\"utf-8\")\n        self.assertIn(\"latest_issue_utc\", metrics)\n        self.assertIn('F.col(\"latest_issue_utc\") <', metrics)")

          provisioning_tests = "Raw/workspace-reset/test_sync_workspace_from_git.py"
          replace(provisioning_tests,
              "        self.assertFalse(any(\"/jobs/Pipeline/schedules\" in url for _, url in fabric.requests))",
              "        schedule_posts = [\n            index for index, (method, url) in enumerate(fabric.requests)\n            if method == \"POST\" and \"/jobs/Pipeline/schedules\" in url\n        ]\n        self.assertEqual(len(schedule_posts), 1)\n        self.assertFalse(fabric.request_kwargs[schedule_posts[0]][\"json\"][\"enabled\"])")
          PY
      - name: Validate remediation
        shell: bash
        run: |
          python -m unittest Raw/workspace-reset/test_weather_source_contracts.py
          cd Raw/workspace-reset
          python -m unittest test_sync_workspace_from_git.py
          cd ../../HydroOperationsApp
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          node --test scripts/*.test.mjs
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydroOperationsApp Raw Notebooks
          git commit -m "Resolve final weather review findings"
          git push origin HEAD:feat/weather-operations