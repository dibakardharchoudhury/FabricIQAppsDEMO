name: Normalize schedule test indentation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-executor-pinpoint.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
      - shell: python
        run: |
          from pathlib import Path
          import ast, textwrap
          path = Path('.github/pr10-execute-fixed.txt')
          text = path.read_text()
          start = text.index('          corrected_schedule_tests = ')
          end = text.index('\n', start)
          assignment = text[start:end]
          value = ast.literal_eval(assignment.split('=', 1)[1].strip())
          indented = textwrap.indent(value, '    ')
          replacement = f'          corrected_schedule_tests = {indented!r}'
          path.write_text(text[:start] + replacement + text[end:])
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr10-execute-fixed.txt
          git commit -m "Normalize schedule test class indentation"
          git push origin HEAD:feat/weather-operations
