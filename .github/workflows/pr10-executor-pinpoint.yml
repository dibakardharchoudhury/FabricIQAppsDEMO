name: Repair PR 10 executor quoting
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-executor-pinpoint.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
      - shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/pr10-execute.yml')
          text = path.read_text()
          start = text.index("          schedule_patch = '''# Reconcile one schedule")
          end = text.index("          script = script[:schedule_start]", start)
          block = text[start:end]
          fixed = block.replace(r"\'", r"\\'")
          if fixed == block:
              raise SystemExit('No nested apostrophe escapes found')
          path.write_text(text[:start] + fixed + text[end:])
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr10-execute.yml
          git commit -m "Repair nested schedule quoting"
          git push origin HEAD:feat/weather-operations
