name: Stage schedule regression test repair
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-executor-pinpoint.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
      - shell: python
        run: |
          from pathlib import Path
          import textwrap
          path = Path('.github/workflows/pr10-execute.yml')
          text = path.read_text()
          anchor = "          exec(compile(script, 'remaining-fixes', 'exec'))"
          corrected_tests = textwrap.dedent('''\
              def test_matching_schedule_is_retained_and_stale_duplicate_is_deleted(self):
                  fabric = FakeFabric()
                  existing = FakeResponse(200, {"value": [
                      {"id": "valid", "enabled": True, "configuration": {
                          "type": "Cron", "interval": 360, "localTimeZoneId": "UTC",
                          "startDateTime": "2026-09-16T03:20:00Z",
                      }},
                      {"id": "stale", "enabled": True, "configuration": {
                          "type": "Cron", "interval": 240, "localTimeZoneId": "UTC",
                          "startDateTime": "2026-09-16T03:00:00Z",
                      }},
                  ]})
                  original_request = fabric.request
                  fabric.request = Mock(side_effect=lambda method, url, **kwargs: existing
                      if method == "GET" and "/jobs/Pipeline/schedules" in url
                      else original_request(method, url, **kwargs))

                  with contextlib.redirect_stdout(io.StringIO()):
                      configure_weather_schedule(fabric, "workspace-id", "weather-pipeline")

                  writes = [(call.args[0], call.args[1]) for call in fabric.request.call_args_list if call.args[0] != "GET"]
                  self.assertEqual([method for method, _ in writes], ["DELETE"])
                  self.assertTrue(writes[0][1].endswith("/stale"))

              def test_multiple_stale_schedules_repairs_one_and_deletes_extras(self):
                  fabric = FakeFabric()
                  existing = FakeResponse(200, {"value": [
                      {"id": "keep", "enabled": False, "configuration": {}},
                      {"id": "extra-one", "enabled": True, "configuration": {"type": "Cron", "interval": 240}},
                      {"id": "extra-two", "enabled": True, "configuration": {"type": "Cron", "interval": 120}},
                  ]})
                  original_request = fabric.request
                  fabric.request = Mock(side_effect=lambda method, url, **kwargs: existing
                      if method == "GET" and "/jobs/Pipeline/schedules" in url
                      else original_request(method, url, **kwargs))

                  with contextlib.redirect_stdout(io.StringIO()):
                      configure_weather_schedule(fabric, "workspace-id", "weather-pipeline")

                  writes = [(call.args[0], call.args[1]) for call in fabric.request.call_args_list if call.args[0] != "GET"]
                  self.assertEqual([method for method, _ in writes], ["PATCH", "DELETE", "DELETE"])
                  self.assertTrue(writes[0][1].endswith("/keep"))
                  self.assertEqual({url.rsplit("/", 1)[-1] for _, url in writes[1:]}, {"extra-one", "extra-two"})

          ''')
          addition = '\n'.join([
              anchor,
              "          schedule_test_path = Path('Raw/workspace-reset/test_sync_workspace_from_git.py')",
              "          schedule_test_text = schedule_test_path.read_text(encoding='utf-8')",
              "          schedule_test_start = schedule_test_text.index('    def test_matching_schedule_is_retained_and_stale_duplicate_is_deleted')",
              "          schedule_test_end = schedule_test_text.index('    def test_already_published_environment_is_not_republished_without_git_update', schedule_test_start)",
              f"          corrected_schedule_tests = {corrected_tests!r}",
              "          schedule_test_path.write_text(schedule_test_text[:schedule_test_start] + corrected_schedule_tests + schedule_test_text[schedule_test_end:], encoding='utf-8')",
          ])
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one executor anchor, found {text.count(anchor)}')
          Path('.github/pr10-execute-fixed.txt').write_text(text.replace(anchor, addition))
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr10-execute-fixed.txt
          git commit -m "Stage schedule regression test repair"
          git push origin HEAD:feat/weather-operations
