name: Apply and validate PR 10 fixes

on:
  push:
    branches:
      - feat/weather-operations
    paths:
      - .github/workflows/pr10-review-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          try:
              workflow = Path('.github/workflows/pr10-review-fixes.yml').read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY", start)
              script = textwrap.dedent(workflow[start:end])
              setup_marker = '\nsetup_notebook = "Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb"'
              if script.count(setup_marker) != 1:
                  raise RuntimeError(f'Expected one setup notebook patch marker, found {script.count(setup_marker)}')
              structured_patch = [
                  '',
                  'setup_notebook = Path("Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb")',
                  'notebook = json.loads(setup_notebook.read_text(encoding="utf-8"))',
                  'anchors = []',
                  'for cell in notebook.get("cells", []):',
                  '    source = cell.get("source", [])',
                  '    if not any("chain_notebooks = [" in line for line in source):',
                  '        continue',
                  '    for index, line in enumerate(source):',
                  '        if line.strip() == \'"Weather_003_fetch_ukmet",\':',
                  '            anchors.append((source, index))',
                  'if len(anchors) != 1:',
                  '    raise RuntimeError(f"Expected one Weather_003 chain anchor, found {len(anchors)}")',
                  'source, index = anchors[0]',
                  'if any(\'"Weather_020_area_calculations"\' in line for line in source):',
                  '    raise RuntimeError("Weather_020 is already present in the setup chain")',
                  'source.insert(index + 1, \'    "Weather_020_area_calculations",\\n\')',
                  'setup_notebook.write_text(json.dumps(notebook, indent=1) + "\\n", encoding="utf-8")',
                  '',
              ]
              script = script[:script.index(setup_marker)] + '\n'.join(structured_patch)
              script = 'import json\n' + script
              exec(compile(script, '.github/workflows/pr10-review-fixes.yml', 'exec'))
          except BaseException:
              details = traceback.format_exc().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Guarded patch failure::{details}')
              raise
          PY

      - name: Install focused Python test dependencies
        run: python -m pip install -r Raw/workspace-reset/requirements.txt

      - name: Validate Python behavior and source contracts
        run: |
          python -m py_compile Notebooks/Weather_*.Notebook/notebook-content.py
          (
            cd Raw/workspace-reset
            python -m unittest -v test_sync_workspace_from_git.py test_deploy_fabric_app.py
          )
          python - <<'PY'
          import json
          from pathlib import Path

          pipeline = json.loads(Path('Orchestrator_Pipelines/03_Pipe_Weather.DataPipeline/pipeline-content.json').read_text(encoding='utf-8'))
          conditions = [condition for activity in pipeline['properties']['activities'] for dependency in activity.get('dependsOn', []) for condition in dependency.get('dependencyConditions', [])]
          assert conditions == ['Completed', 'Completed'], conditions

          setup = json.loads(Path('Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb').read_text(encoding='utf-8'))
          setup_source = '\n'.join(line for cell in setup['cells'] for line in cell.get('source', []))
          assert 'Weather_020_area_calculations' in setup_source

          source = Path('Notebooks/Weather_020_area_calculations.Notebook/notebook-content.py').read_text(encoding='utf-8')
          assert source.index('selected_forecast_types =') < source.index('area_forecasts = forecasts.join(area_locations')
          assert 'latest_issue_only(forecasts)' in source
          assert 'latest_issue_only(spark.table(TABLES["forecasts"]))' not in source

          aurora = Path('Notebooks/Weather_002_fetch_area_weather.Notebook/notebook-content.py').read_text(encoding='utf-8')
          assert aurora.index('"status": "started"') < aurora.index('getSecret(key_vault_uri, api_key_secret_name)')
          assert 'json.dumps(sanitize_stac_item(item), indent=2)' in aurora
          assert '_replace(query="")' in aurora

          ukmet = Path('Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py').read_text(encoding='utf-8')
          assert ukmet.index('"status": "started"') < ukmet.index('global_spot_api_key = notebookutils.credentials.getSecret')
          assert ukmet.index('"status": "started"') < ukmet.index('land_observations_api_key = notebookutils.credentials.getSecret')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json

      - name: Typecheck and build frontend
        working-directory: HydroOperationsApp
        run: |
          set -o pipefail
          (npm ci --no-audit --no-fund && npm exec tsc -- -b && npm exec vite -- build) 2>&1 | tee /tmp/frontend-validation.log || {
            python -c "from pathlib import Path; text = Path('/tmp/frontend-validation.log').read_text(encoding='utf-8')[-6000:]; print('::error title=Frontend validation failure::' + text.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A'))"
            exit 1
          }

      - name: Commit validated fixes
        run: |
          git rm .github/workflows/pr10-review-apply.yml .github/workflows/pr10-review-diagnose.yml .github/workflows/pr10-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Notebooks Raw
          git commit -m "Resolve remaining Copilot review findings"
          git push origin HEAD:feat/weather-operations
