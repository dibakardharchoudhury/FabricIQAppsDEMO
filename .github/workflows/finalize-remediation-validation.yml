name: Finalize remediation validation correction
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/finalize-remediation-validation.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Correct and retrigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/copilot-review-remediation.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(lines) if line.strip() == 'npm test']
          if len(matches) != 1:
              raise SystemExit(f'expected one npm test line, found {len(matches)}')
          index = matches[0]
          indent = lines[index][:-len(lines[index].lstrip())]
          lines[index:index + 1] = [
              f'{indent}node --test scripts/*.test.mjs',
              f'{indent}npm run test:knowledge-graph',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/correct-remediation-validation.yml
          rm .github/workflows/retry-remediation-validation.yml
          rm .github/workflows/finalize-remediation-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: use actual Node test suites"
          git push origin HEAD:feat/weather-operations
