name: Diagnose final PR 10 anchors
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-anchor-diagnose.yml]
permissions:
  contents: read
jobs:
  weather-020:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          text = Path('Notebooks/Weather_020_area_calculations.Notebook/notebook-content.py').read_text()
          checks = [
            'forecast_type_keys = ["source_id", "reference_time_utc", "location_id"]',
            'def widen(frame, target_kind, target_column, value_column, extra_columns):',
            'Window.partitionBy("source_id", "variable_id", "location_id", "reference_time_utc")',
            'latest_issue_only(forecasts)',
            'latest_issue_only(spark.table(TABLES["area_metrics"]).filter(F.col("data_kind") == "forecast"))',
          ]
          assert all(text.count(value) == 1 for value in checks), [(value, text.count(value)) for value in checks]
  weather-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          text = Path('HydroOperationsApp/src/ui-shared/pages/WeatherPage.tsx').read_text()
          assert text.count("import { WeatherMap, type WeatherSelection } from '../components/weather/WeatherMap'") == 1
          assert text.count('const inWindow = selectedForecasts.filter') == 1
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          text = Path('HydroOperationsApp/src/services/fabric.ts').read_text()
          checks = [
            'async function ensureConfig(interactive: boolean): Promise<ResolvedConfig | null>',
            'export async function queryWeatherData(interactive = false): Promise<WeatherData | null> {\n  const config = await ensureConfig(false)',
            'const token = await silentToken([GRAPHQL_SCOPE]) ?? (interactive ? await popupToken([GRAPHQL_SCOPE]) : null)',
            'const query = `query HydroWeather',
          ]
          assert all(text.count(value) == 1 for value in checks), [(value, text.count(value)) for value in checks]
  notebook-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          text = Path('Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb').read_text()
          value = r'{\"Weather_002_fetch_area_weather\", \"Weather_003_fetch_ukmet\"}'
          assert text.count(value) == 2, text.count(value)
  schedule-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          sync = Path('Raw/workspace-reset/sync_workspace_from_git.py').read_text()
          assert sync.count('for schedule in schedules:\n        if weather_schedule_matches(schedule):') == 1
          assert sync.count('    if schedules:\n        schedule_id = schedules[0].get("id")') == 1
          assert Path('Raw/workspace-reset/test_sync_workspace_from_git.py').read_text().count('    def test_already_published_environment_is_not_republished_without_git_update(self):') == 1
          assert Path('HydroOperationsApp/rayfin/rayfin.yml').read_text().count('      - https://right-forge-2c0b55c94f-swedencentral.webapp.fabricapps.net\n') == 1
          docs = Path('docs/weather-fabric-port-plan.md').read_text()
          assert docs.count('`unit` is not repeated on these rows; it is fixed per variable and read from `weather_variables`. Applications query the serving tables; analytics and any ad-hoc SQL or KQL continue to use the long tables.') == 1
