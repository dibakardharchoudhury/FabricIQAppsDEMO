      - name: Update PR description contract
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json
          import os
          import re
          import urllib.request

          url = 'https://api.github.com/repos/dibakardharchoudhury/FabricIQAppsDEMO/pulls/10'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              pull = json.load(response)
          replacement = ('Treats the current Entra SPA redirect snapshot as authoritative, then adds only the current '
                         'hosting origin and localhost to `rayfin.yml`; stale local-only origins are removed rather than restored.')
          body, count = re.subn(
              r'Changes Rayfin redirect handling to merge existing `rayfin\.yml` origins with Entra/current deployment origins, preserving teammate app URLs\s+while validating only tenant-relevant Entra redirects\.',
              replacement,
              pull['body'],
          )
          if count != 1:
              raise SystemExit(f'Expected one conflicting PR description statement, found {count}')
          request = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='PATCH')
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise SystemExit(f'PR update failed: {response.status}')

