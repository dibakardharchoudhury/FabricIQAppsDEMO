name: Correct remediation validation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/correct-remediation-validation.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Use repository test commands
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/copilot-review-remediation.yml')
          text = path.read_text(encoding='utf-8')
          old = '          npm test\n'
          new = '          node --test scripts/*.test.mjs\n          npm run test:knowledge-graph\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one npm test command, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/correct-remediation-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: use actual Node test suites"
          git push origin HEAD:feat/weather-operations
