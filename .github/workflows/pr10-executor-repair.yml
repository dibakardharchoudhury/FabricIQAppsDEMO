name: Repair PR 10 remediation executor

on:
  push:
    branches:
      - feat/weather-operations
    paths:
      - .github/workflows/pr10-executor-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Install declared Python dependencies in executor
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/pr10-suppressed-remediation.yml')
          source = path.read_text(encoding='utf-8')
          old = "      - name: Validate provisioning tests\n        working-directory: Raw/workspace-reset\n        run: python -m unittest test_sync_workspace_from_git.py\n"
          new = "      - name: Install provisioning dependencies\n        run: python -m pip install -r Raw/workspace-reset/requirements.txt\n" + old
          assert source.count(old) == 1
          path.write_text(source.replace(old, new), encoding='utf-8')
      - name: Commit executor repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr10-executor-repair.yml
          git add .github/workflows/pr10-suppressed-remediation.yml
          git commit -m "Install PR remediation test dependencies"
          git push origin HEAD:feat/weather-operations
