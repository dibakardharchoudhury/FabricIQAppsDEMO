name: Copilot review remediation
on:
  push:
    branches: [feat/weather-operations]
    paths:
      - .github/workflows/copilot-review-remediation.yml
      - .github/final_weather_remediation.py
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Apply exact review fixes
        run: python .github/final_weather_remediation.py
      - name: Install Python dependencies
        run: python -m pip install -r Raw/workspace-reset/requirements.txt
      - name: Test provisioning and weather contracts
        working-directory: Raw/workspace-reset
        run: python -m unittest test_sync_workspace_from_git.py test_weather_source_contracts.py
      - name: Validate notebook mirrors
        run: python -c "import json; from pathlib import Path; files=list(Path('Raw/RTI_Notebooks').glob('Weather_*.ipynb')); assert len(files)==4; assert all(json.loads(p.read_text(encoding='utf-8'))['cells'] for p in files)"
      - name: Install frontend dependencies
        working-directory: HydroOperationsApp
        run: npm ci
      - name: Type-check frontend
        working-directory: HydroOperationsApp
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Bundle frontend
        working-directory: HydroOperationsApp
        run: npx vite build
      - name: Run Node tests
        working-directory: HydroOperationsApp
        run: node --test scripts/*.test.mjs
      - name: Run knowledge graph tests
        working-directory: HydroOperationsApp
        run: npm run test:knowledge-graph
      - name: Commit validated fixes and remove temporary files
        run: |
          rm .github/final_weather_remediation.py
          rm .github/workflows/copilot-review-remediation.yml
          rm -f .github/remediation-build-error.txt
          rm -f .github/workflows/correct-remediation-validation.yml
          rm -f .github/workflows/retry-remediation-validation.yml
          rm -f .github/workflows/finalize-remediation-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: close final weather review gaps"
          git push origin HEAD:feat/weather-operations
