name: Copilot review remediation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/copilot-review-remediation.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Apply exact review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          fabric = 'HydroOperationsApp/src/services/fabric.ts'
          replace(
              fabric,
              "const weatherPipelineName = '03_Pipe_Weather'\n",
              "const weatherPipelineName = '03_Pipe_Weather'\nconst weatherSetupNotebookName = 'Weather_001_create_lakehouse'\n",
          )
          replace(
              fabric,
              "async function runWeatherSequence(onStatus?: JobProgress, resumeSinceIso?: string): Promise<JobStatus> {\n  const pipelineId = await resolveWeatherPipelineId()\n  const alreadyCompleted = resumeSinceIso && (await statusSince(pipelineId, resumeSinceIso)) === 'Completed'\n",
              "async function runWeatherSequence(onStatus?: JobProgress, resumeSinceIso?: string): Promise<JobStatus> {\n  const setupNotebookId = await resolveNotebookId(weatherSetupNotebookName)\n  const setupCompleted = resumeSinceIso && (await statusSince(setupNotebookId, resumeSinceIso)) === 'Completed'\n  if (!setupCompleted) {\n    const setupStatus = await runJob(setupNotebookId, 'RunNotebook', onStatus, {\n      timeoutMs: 15 * 60_000,\n      reuseActive: true,\n    })\n    if (setupStatus !== 'Completed') return setupStatus\n  }\n\n  const pipelineId = await resolveWeatherPipelineId()\n  const alreadyCompleted = resumeSinceIso && (await statusSince(pipelineId, resumeSinceIso)) === 'Completed'\n",
          )

          sync = 'Raw/workspace-reset/sync_workspace_from_git.py'
          replace(sync, 'def weather_schedule_matches(schedule: dict[str, Any]) -> bool:\n', 'def weather_schedule_matches(schedule: dict[str, Any], enabled: bool = True) -> bool:\n')
          replace(sync, '    return (schedule.get("enabled") is True\n', '    return (schedule.get("enabled") is enabled\n')
          replace(sync, '    retained = next((schedule for schedule in schedules if weather_schedule_matches(schedule)), None)\n', '    retained = next(\n        (schedule for schedule in schedules if weather_schedule_matches(schedule, enabled)),\n        None,\n    )\n')
          replace(sync, '    elif weather_schedule_matches(retained):\n', '    elif weather_schedule_matches(retained, enabled):\n')

          test = 'Raw/workspace-reset/test_sync_workspace_from_git.py'
          insertion = '''\n    def test_enabled_schedule_is_disabled_when_bindings_are_not_ready(self):
        fabric = FakeFabric()
        existing = FakeResponse(
            200,
            {"value": [{"id": "schedule-id", "enabled": True,
                        "configuration": {
                            "type": "Cron",
                            "interval": 360,
                            "localTimeZoneId": "UTC",
                            "startDateTime": "2026-09-16T03:20:00Z",
                            "endDateTime": "2036-09-16T03:20:00Z",
                        }}]},
        )
        original_request = fabric.request
        fabric.request = Mock(
            side_effect=lambda method, url, **kwargs: existing
            if method == "GET" and "/jobs/Pipeline/schedules" in url
            else original_request(method, url, **kwargs)
        )

        with contextlib.redirect_stdout(io.StringIO()):
            configure_weather_schedule(
                fabric, "workspace-id", "weather-pipeline", enabled=False
            )

        patch_calls = [
            call for call in fabric.request.call_args_list
            if call.args[0] == "PATCH" and "/jobs/Pipeline/schedules/" in call.args[1]
        ]
        self.assertEqual(len(patch_calls), 1)
        self.assertFalse(patch_calls[0].kwargs["json"]["enabled"])
'''
          replace(test, '\n    def test_wrong_offset_weather_schedule_is_updated(self):\n', insertion + '\n    def test_wrong_offset_weather_schedule_is_updated(self):\n')

          setup_call = '''print("\\n=== STEP 5: Create or verify weather tables before schedule activation ===")
          weather_setup_result = notebookutils.notebook.run(
              "Weather_001_create_lakehouse",
              3600,
          )
          print("Weather schema setup completed:", weather_setup_result)

'''
          canonical_rti1 = 'Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py'
          replace(canonical_rti1, 'def _activate_weather_schedule() -> None:\n', setup_call + 'def _activate_weather_schedule() -> None:\n')

          raw_rti1 = Path('Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb')
          notebook = json.loads(raw_rti1.read_text(encoding='utf-8'))
          changed = 0
          for cell in notebook['cells']:
              source = ''.join(cell.get('source', []))
              if 'def _activate_weather_schedule() -> None:' in source:
                  source = source.replace('def _activate_weather_schedule() -> None:\n', setup_call + 'def _activate_weather_schedule() -> None:\n')
                  cell['source'] = source.splitlines(keepends=True)
                  changed += 1
          if changed != 1:
              raise SystemExit(f'raw RTI_001 activation matches: {changed}')
          raw_rti1.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')

          for path in ('Notebooks/RTI_Orchestrator_Setup.Notebook/notebook-content.py', 'Raw/RTI_Notebooks/RTI_Orchestrator_Setup.ipynb'):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              text = text.replace('        # Weather tables are source-neutral and only need the lakehouse, so they build alongside the RTI chain.\n', '')
              text = text.replace('        {"name": "NBW01_weather",   "path": "Weather_001_create_lakehouse",                  "dependencies": [],                                   "args": _lh, "timeoutPerCellInSeconds": per_notebook_timeout_secs},\n', '')
              text = text.replace('print("✅ Setup orchestration complete (NB02–06, 08–10, Weather_001).")', 'print("✅ Setup orchestration complete (NB02–06, 08–10).")')
              file.write_text(text, encoding='utf-8')

          def fabric_source_to_ipynb(source_path):
              lines = Path(source_path).read_text(encoding='utf-8').splitlines(keepends=True)
              cells = []
              kind = None
              source = []
              metadata = {}
              def flush():
                  nonlocal kind, source, metadata
                  if kind and source:
                      cell = {"cell_type": kind, "metadata": metadata, "source": source}
                      if kind == 'code':
                          cell.update({"execution_count": None, "outputs": []})
                      cells.append(cell)
                  kind, source, metadata = None, [], {}
              for line in lines:
                  if line.startswith('# MARKDOWN ********************'):
                      flush(); kind = 'markdown'; continue
                  if line.startswith('# PARAMETERS CELL ********************'):
                      flush(); kind = 'code'; metadata = {'tags': ['parameters']}; continue
                  if line.startswith('# CELL ********************'):
                      flush(); kind = 'code'; continue
                  if line.startswith('# METADATA ********************'):
                      flush(); continue
                  if kind == 'markdown':
                      if line.startswith('# '): source.append(line[2:])
                      elif line.startswith('#'): source.append(line[1:])
                  elif kind == 'code':
                      source.append(line)
              flush()
              return {"cells": cells, "metadata": {"kernelspec": {"display_name": "synapse_pyspark", "name": "synapse_pyspark"}, "language_info": {"name": "python"}}, "nbformat": 4, "nbformat_minor": 5}

          for name in ('Weather_001_create_lakehouse', 'Weather_002_fetch_area_weather', 'Weather_003_fetch_ukmet', 'Weather_020_area_calculations'):
              source = f'Notebooks/{name}.Notebook/notebook-content.py'
              target = Path(f'Raw/RTI_Notebooks/{name}.ipynb')
              target.write_text(json.dumps(fabric_source_to_ipynb(source), indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate focused remediation
        shell: bash
        run: |
          python -m pip install -r Raw/workspace-reset/requirements.txt
          (cd Raw/workspace-reset && python -m unittest test_sync_workspace_from_git.py test_weather_source_contracts.py)
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('Raw/RTI_Notebooks').glob('Weather_*.ipynb'):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['nbformat'] == 4 and data['cells'], path
          PY
          cd HydroOperationsApp
          npm ci
          npm run build
          node --test scripts/*.test.mjs
          npm run test:knowledge-graph
      - name: Commit validated fixes and remove workflows
        shell: bash
        run: |
          rm .github/workflows/copilot-review-remediation.yml
          rm -f .github/workflows/correct-remediation-validation.yml
          rm -f .github/workflows/retry-remediation-validation.yml
          rm -f .github/workflows/finalize-remediation-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: close final weather review gaps"
          git push origin HEAD:feat/weather-operations
