name: Repair PR 10 second remediation workflow
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-second-remediation-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Repair YAML block indentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/pr10-second-remediation.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          extra = '''\n"
          end_marker = "'''\n          replace(contracts,"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError('Expected one malformed embedded contract block')
          before, rest = text.split(start_marker, 1)
          block, after = rest.split(end_marker, 1)
          repaired = '\n'.join('          ' + line for line in block.split('\n'))
          path.write_text(before + start_marker + repaired + "          '''\n          replace(contracts," + after, encoding='utf-8')
      - name: Commit repair
        run: |
          rm .github/workflows/pr10-second-remediation-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair second remediation workflow syntax"
          git push origin HEAD:feat/weather-operations
