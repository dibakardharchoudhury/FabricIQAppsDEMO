name: Execute PR 10 second remediation
on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-second-remediation-executor.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Extract and apply exact-match remediation
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/pr10-second-remediation.yml').read_text(encoding='utf-8')
          start = workflow.index('        run: |\n') + len('        run: |\n')
          end = workflow.index('      - name: Focused Python validation\n', start)
          lines = workflow[start:end].splitlines()
          output = []
          embedded = False
          for line in lines:
              if embedded:
                  output.append(line)
                  if line == "'''":
                      embedded = False
                  continue
              if not line.startswith('          '):
                  raise RuntimeError(f'Unexpected remediation indentation: {line!r}')
              normalized = line[10:]
              output.append(normalized)
              if normalized == "extra = '''":
                  embedded = True
          if embedded:
              raise RuntimeError('Unterminated embedded contract block')
          Path('/tmp/remediate.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          compile(Path('/tmp/remediate.py').read_text(encoding='utf-8'), '/tmp/remediate.py', 'exec')
          exec(compile(Path('/tmp/remediate.py').read_text(encoding='utf-8'), '/tmp/remediate.py', 'exec'))
      - name: Focused Python validation
        run: |
          python -m pip install -r Raw/workspace-reset/requirements.txt
          python Raw/workspace-reset/test_weather_source_contracts.py
          cd Raw/workspace-reset
          python test_sync_workspace_from_git.py
      - name: Python compile validation
        run: python -m py_compile Raw/workspace-reset/sync_workspace_from_git.py Notebooks/Weather_001_create_lakehouse.Notebook/notebook-content.py Notebooks/Weather_002_fetch_area_weather.Notebook/notebook-content.py Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HydroOperationsApp/package-lock.json
      - name: Frontend validation
        working-directory: HydroOperationsApp
        run: |
          npm ci
          npm run typecheck
          node --import tsx --test scripts/weather-summary.test.ts
          node --test scripts/*.test.mjs
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HydroOperationsApp/src/services/fabric.ts HydroOperationsApp/src/ui-shared/pages/WeatherPage.tsx HydroOperationsApp/src/ui-shared/weatherSummary.ts HydroOperationsApp/scripts/weather-summary.test.ts Raw/workspace-reset/sync_workspace_from_git.py Raw/workspace-reset/test_sync_workspace_from_git.py Raw/workspace-reset/test_weather_source_contracts.py Notebooks/Weather_002_fetch_area_weather.Notebook/notebook-content.py Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py Notebooks/RTI_001_create_lakehouse_SelfContained.Notebook/notebook-content.py Raw/RTI_Notebooks/RTI_001_create_lakehouse_SelfContained.ipynb
          git commit -m "Resolve remaining Copilot review findings"
          git push origin HEAD:feat/weather-operations
