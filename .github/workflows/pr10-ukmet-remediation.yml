name: PR 10 UKMet remediation

on:
  push:
    branches: [feat/weather-operations]
    paths: [.github/workflows/pr10-ukmet-remediation.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/weather-operations
          fetch-depth: 0
      - name: Patch UKMet contracts
        shell: python
        run: |
          from pathlib import Path

          notebook_path = Path("Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py")
          source = notebook_path.read_text(encoding="utf-8")
          old_bucket = "        valid_time = reference_time + timedelta(hours=bucket_lead)\n        for variable_id, (aliases, unit) in FORECAST_FIELDS.items():"
          new_bucket = "        actual_lead = members[-1][0]\n        valid_time = reference_time + timedelta(hours=actual_lead)\n        for variable_id, (aliases, unit) in FORECAST_FIELDS.items():"
          if source.count(old_bucket) != 1:
              raise RuntimeError("Expected one nominal UKMet bucket timestamp")
          source = source.replace(old_bucket, new_bucket)
          old_lead = "                \"lead_hours\": bucket_lead,\n                \"interval_hours\": interval_hours,"
          new_lead = "                \"lead_hours\": actual_lead,\n                \"interval_hours\": interval_hours,"
          if source.count(old_lead) != 1:
              raise RuntimeError("Expected one nominal UKMet persisted lead")
          source = source.replace(old_lead, new_lead)

          helper_anchor = "def time_series(payload: dict) -> list[dict]:\n    features = payload.get(\"features\") or []"
          helper_replacement = """def has_recent_mapped_observation(payload, cutoff: datetime) -> bool:
              if not isinstance(payload, list):
                  return False
              for record in payload:
                  observed_text = record.get("datetime")
                  if not observed_text or utc_datetime(observed_text) < cutoff:
                      continue
                  for variable_id, (field_name, _) in OBSERVATION_FIELDS.items():
                      raw_value = record.get(field_name)
                      value = COMPASS_DEGREES.get(str(raw_value).upper()) if variable_id == "wind_direction" else finite_number(raw_value)
                      if value is not None:
                          return True
              return False


          def time_series(payload: dict) -> list[dict]:
              features = payload.get("features") or []"""
          helper_replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in helper_replacement.splitlines())
          if source.count(helper_anchor) != 1:
              raise RuntimeError("Expected UKMet time_series helper anchor")
          source = source.replace(helper_anchor, helper_replacement)
          old_candidate = "        if isinstance(payload, list) and payload:\n            station, geohash, observations_payload = candidate, candidate_geohash, payload\n            break"
          new_candidate = "        if has_recent_mapped_observation(payload, observation_cutoff):\n            station, geohash, observations_payload = candidate, candidate_geohash, payload\n            break"
          if source.count(old_candidate) != 1:
              raise RuntimeError("Expected one payload-only UKMet candidate selection")
          source = source.replace(old_candidate, new_candidate)
          notebook_path.write_text(source, encoding="utf-8")

          test_path = Path("Raw/workspace-reset/test_weather_source_contracts.py")
          tests = test_path.read_text(encoding="utf-8")
          old_assertions = "        self.assertNotIn('raise RuntimeError(\"UKMet Land Observations returned no mapped recent values\")', ukmet)\n        self.assertIn(\"keeping forecast ingestion\", ukmet)"
          new_assertions = old_assertions + "\n        self.assertIn(\"actual_lead = members[-1][0]\", ukmet)\n        self.assertIn('\"lead_hours\": actual_lead', ukmet)\n        self.assertNotIn('\"lead_hours\": bucket_lead', ukmet)\n        self.assertIn(\"has_recent_mapped_observation(payload, observation_cutoff)\", ukmet)\n        self.assertNotIn(\"if isinstance(payload, list) and payload:\", ukmet)"
          if tests.count(old_assertions) != 1:
              raise RuntimeError("Expected UKMet contract assertion anchor")
          test_path.write_text(tests.replace(old_assertions, new_assertions), encoding="utf-8")
      - name: Validate focused contracts
        run: |
          python Raw/workspace-reset/test_weather_source_contracts.py
          python -m py_compile Notebooks/Weather_003_fetch_ukmet.Notebook/notebook-content.py
      - name: Commit remediation and remove executor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/pr10-ukmet-remediation.yml
          git add -A
          git commit -m "Fix UKMet partial buckets and station fallback"
          git push origin HEAD:feat/weather-operations
