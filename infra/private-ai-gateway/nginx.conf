worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    resolver 168.63.129.16 valid=60s ipv6=off;

    server {
        listen 443 ssl default_server;
        server_name ai.espen.io;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 1m;

        if ($host != ai.espen.io) {
            return 421;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "proxy-ready; upstream status not checked\n";
        }

        location / {
            set $gateway_upstream aigatewayp-j4rqjxpeakwtc.swedencentral-01.ai.gateway.azure.com;
            proxy_pass https://$gateway_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host aigatewayp-j4rqjxpeakwtc.swedencentral-01.ai.gateway.azure.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name aigatewayp-j4rqjxpeakwtc.swedencentral-01.ai.gateway.azure.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 4;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_redirect off;
            add_header X-AI-Gateway-Proxy-Upstream-Status $upstream_status always;
        }
    }
}
