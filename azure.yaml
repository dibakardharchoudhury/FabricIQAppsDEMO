# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.0'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.18'
        microsoft.foundry: '>=1.0.0-beta.2'
name: hydro-orchestrator
resourceGroup: ${AZURE_RESOURCE_GROUP}
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://foundryfabriciqappsdemo-resource.services.ai.azure.com/api/projects/foundryfabriciqappsdemo
    hydro-orchestrator:
        project: .
        host: azure.ai.agent
        language: docker
        image: ${HYDRO_ORCHESTRATOR_IMAGE}
        docker:
            path: HydroOperationsService/Dockerfile
            context: .
            imagePassthrough: true
            remoteBuild: false
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            HYDRO_ORCHESTRATOR_CONFIG: ${HYDRO_ORCHESTRATOR_CONFIG}
            HYDRO_FABRIC_SOURCE_CONFIG: ${HYDRO_FABRIC_SOURCE_CONFIG}
            HYDRO_RUNTIME_STATE_DIR: ${HYDRO_RUNTIME_STATE_DIR}
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: Hydro Operations Agent Framework coordinator.
        kind: hosted
        name: hydro-orchestrator
        protocols:
            - protocol: invocations
              version: 2.0.0
